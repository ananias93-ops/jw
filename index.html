<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>고수온 관측소 지도 (2026-08-04)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#0a1628;color:#e8f4f8;height:100vh;display:flex;flex-direction:column;}

  /* ── 헤더 (탭 + 메타정보 통합, 1줄) ── */
  header{padding:0 18px;background:#0d1e36;border-bottom:2px solid #1e3a5f;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
  .tab-bar-inline{display:flex;}
  .meta{font-size:11px;color:#6b8fa8;text-align:right;white-space:nowrap;}
  .meta b{color:#f4a261;}

  /* ── 탭 ── */
  .tab-btn{padding:9px 28px;font-size:13px;font-weight:600;color:#6b8fa8;cursor:pointer;border:none;background:transparent;border-bottom:3px solid transparent;margin-bottom:-2px;transition:color .2s,border-color .2s;letter-spacing:-0.2px;}
  .tab-btn:hover{color:#b8d8e8;}
  .tab-btn.active{color:#f4a261;border-bottom-color:#f4a261;}
  .tab-sub{font-size:10px;font-weight:400;color:#6b8fa8;margin-left:5px;}
  .tab-btn.active .tab-sub{color:#7ec8e3;}

  /* ── 지도 패널 ── */
  .map-panel{flex:1;position:relative;display:none;}
  .map-panel.active{display:block;}
  .map-panel > div[id^="map"]{width:100%;height:100%;}

  /* ── 팝업 ── */
  .custom-popup .leaflet-popup-content-wrapper{background:#0d1e36;border:1px solid #1e3a5f;border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,.5);color:#e8f4f8;}
  .custom-popup .leaflet-popup-tip{background:#1e3a5f;}
  .popup-inner{padding:4px 2px;min-width:155px;}
  .popup-rank{font-size:11px;color:#f4a261;margin-bottom:2px;}
  .popup-name{font-size:15px;font-weight:700;color:#fff;margin-bottom:5px;}
  .popup-sea{display:inline-block;font-size:11px;background:#1e3a5f;border-radius:4px;padding:2px 7px;margin-bottom:7px;color:#7ec8e3;}
  .popup-temp{font-size:26px;font-weight:800;line-height:1;margin-bottom:6px;}
  .popup-temp .unit{font-size:13px;font-weight:500;opacity:.8;}
  .popup-row{font-size:12px;color:#7ec8e3;display:flex;justify-content:space-between;gap:14px;margin-top:3px;}

  /* ── 마커 ── */
  .temp-marker{border-radius:50%;border:2.5px solid;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.5);cursor:pointer;transition:transform .15s;line-height:1;}
  .temp-marker:hover{transform:scale(1.15);}

  /* ── 범례 / 통계 / 좌표없음 ── */
  .legend{position:absolute;bottom:22px;right:10px;z-index:1000;background:rgba(13,30,54,.92);border:1px solid #1e3a5f;border-radius:8px;padding:11px 15px;font-size:12px;color:#b8d8e8;backdrop-filter:blur(4px);}
  .legend h4{font-size:11px;color:#6b8fa8;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
  .legend-row{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
  .legend-dot{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.4);flex-shrink:0;}
  .stat-bar{position:absolute;top:10px;left:10px;z-index:1000;background:rgba(13,30,54,.92);border:1px solid #1e3a5f;border-radius:8px;padding:10px 13px;font-size:12px;color:#b8d8e8;backdrop-filter:blur(4px);line-height:1.85;white-space:nowrap;}
  .stat-bar .val{color:#f4a261;font-weight:700;}
  .stat-bar .grn{color:#4caf50;font-weight:700;}
  .stat-bar .org{color:#e07020;font-weight:700;}
  .stat-bar .red{color:#e63946;font-weight:700;}
  .stat-bar .lbl{color:#6b8fa8;font-size:11px;}
  .no-coord-box{position:absolute;bottom:22px;left:10px;z-index:1000;background:rgba(13,30,54,.9);border:1px solid #2a4a6f;border-radius:7px;padding:8px 12px;font-size:11px;color:#6b8fa8;max-width:360px;backdrop-filter:blur(4px);}
  .nc-label{color:#f4a261;font-weight:600;margin-right:4px;}
  .nc-item{display:inline-block;margin:2px 4px 2px 0;background:#1e3a5f;border-radius:3px;padding:1px 5px;color:#b8d8e8;}
</style>
</head>
